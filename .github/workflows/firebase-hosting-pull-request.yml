name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        working-directory: ./wellcomlab-refactor  # 작업 디렉토리 설정
        run: npm install
      - name: Build project
        working-directory: ./wellcomlab-refactor  # 작업 디렉토리 설정
        run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WELLCOMLAB_70A36 }}
          projectId: wellcomlab-70a36
        working-directory: ./wellcomlab-refactor  # 작업 디렉토리 설정